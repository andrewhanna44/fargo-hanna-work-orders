<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fargo Hanna Oriental Rugs — Work Orders</title>
<style>
  /* ===========================================================
     Fargo Hanna Oriental Rugs — Work Order System
     Design tokens drawn from an indigo-and-madder oriental rug:
     deep indigo field, madder-red border, saffron guard stripe,
     ivory wool ground. System fonts only (works fully offline).
     =========================================================== */
  :root{
    --ink:        #211e1a;
    --ink-soft:   #5b5346;
    --indigo:     #223154;
    --indigo-700: #1a2643;
    --indigo-100: #e5e8f0;
    --madder:     #7e2b34;
    --madder-700: #642128;
    --saffron:    #c08a2d;
    --sage:       #4e6350;
    --parchment:  #f3efe6;
    --surface:    #faf8f2;
    --white:      #ffffff;
    --line:       #ded7c7;
    --line-soft:  #ebe6d9;

    --display: "Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
    --body: "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono: "Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,Menlo,monospace;

    --r: 8px;
    --shadow: 0 1px 2px rgba(33,30,26,.06), 0 8px 24px rgba(33,30,26,.06);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--body);
    color:var(--ink);
    background:var(--parchment);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; }
  a{ color:var(--madder); }

  /* ---------- App shell ---------- */
  #app{ display:grid; grid-template-columns:264px 1fr; min-height:100vh; }

  .sidebar{
    background:var(--indigo);
    color:#eef0f6;
    padding:26px 20px;
    display:flex; flex-direction:column; gap:8px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ text-align:center; padding:8px 6px 20px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:14px; }
  .brand-plaque{
    background:var(--parchment);
    border-radius:10px;
    padding:16px 14px 12px;
    margin:0 0 10px;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 6px 16px rgba(0,0,0,.18);
  }
  .brand-plaque img{ display:block; width:100%; height:auto; }
  .brand p{ margin:0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#aab3ca; }

  .nav-btn{
    display:flex; align-items:center; gap:11px;
    width:100%; text-align:left;
    background:transparent; color:#d6dbe8;
    border:0; border-radius:var(--r);
    padding:11px 13px; font-size:14.5px; cursor:pointer;
    transition:background .12s, color .12s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .nav-btn.active{ background:var(--saffron); color:#2b2410; font-weight:600; }
  .nav-btn .ico{ width:18px; text-align:center; opacity:.9; }
  .nav-spacer{ flex:1; }
  .side-note{ font-size:11.5px; color:#9aa4bd; line-height:1.5; border-top:1px solid rgba(255,255,255,.12); padding-top:14px; }
  .side-note strong{ color:#c9d0e0; font-weight:600; }

  /* ---------- Main ---------- */
  .main{ padding:34px 40px 60px; max-width:1040px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .page-head h2{ font-family:var(--display); font-size:27px; margin:0; font-weight:600; }
  .page-head .sub{ color:var(--ink-soft); font-size:13.5px; margin-top:3px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    border:1px solid var(--line); background:var(--white); color:var(--ink);
    padding:9px 15px; border-radius:var(--r); font-size:14px; cursor:pointer;
    transition:border-color .12s, background .12s, box-shadow .12s;
  }
  .btn:hover{ border-color:#c9bfa8; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .btn.primary{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .btn.primary:hover{ background:var(--indigo-700); }
  .btn.madder{ background:var(--madder); border-color:var(--madder); color:#fff; }
  .btn.madder:hover{ background:var(--madder-700); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:var(--madder); border-color:#e3c6c9; }
  .btn.danger:hover{ background:#faf0f1; border-color:#d9a9ae; }
  .btn.sm{ padding:6px 11px; font-size:13px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---------- Cards / surfaces ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }

  /* ---------- Toolbar (list) ---------- */
  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .search{
    flex:1; min-width:220px; display:flex; align-items:center; gap:9px;
    background:var(--white); border:1px solid var(--line); border-radius:var(--r); padding:9px 13px;
  }
  .search input{ border:0; outline:0; background:transparent; flex:1; font-size:14.5px; font-family:inherit; color:var(--ink); }
  select.filter{
    background:var(--white); border:1px solid var(--line); border-radius:var(--r);
    padding:9px 12px; font-size:14px; color:var(--ink); font-family:inherit; cursor:pointer;
  }

  /* ---------- Order list ---------- */
  .order-row{
    display:grid; grid-template-columns:96px 1fr 130px 118px 108px; gap:14px; align-items:center;
    background:var(--white); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:9px; cursor:pointer;
    transition:border-color .12s, box-shadow .12s, transform .06s;
  }
  .order-row:hover{ border-color:#c9bfa8; box-shadow:0 2px 10px rgba(33,30,26,.07); }
  .order-row .num{ font-family:var(--mono); font-size:13.5px; color:var(--indigo); font-weight:600; }
  .order-row .who{ font-weight:600; }
  .order-row .who small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12.5px; margin-top:1px; }
  .order-row .type-tag{ font-size:12.5px; color:var(--ink-soft); }
  .order-row .cost{ font-family:var(--mono); font-size:14px; text-align:right; }
  .list-head{
    display:grid; grid-template-columns:96px 1fr 130px 118px 108px; gap:14px;
    padding:0 16px 8px; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft);
  }
  .list-head .r{ text-align:right; }

  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; letter-spacing:.02em; white-space:nowrap; }
  .badge.new{ background:var(--indigo-100); color:var(--indigo); }
  .badge.progress{ background:#f5e6c9; color:#8a641b; }
  .badge.ready{ background:#dfe9e0; color:#3c5340; }
  .badge.picked{ background:#e7e2d7; color:#6b6353; }

  .type-pill{ display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; background:#efe9db; color:#7a6b4d; }
  .type-pill.cleaning{ background:#e2ebf1; color:#345a72; }
  .type-pill.repair{ background:#f1e2e3; color:#84353c; }
  .type-pill.pad{ background:#e6ecdf; color:#4c6141; }
  .type-pill.misc{ background:#ece7dc; color:#6f6449; }

  .empty{ text-align:center; padding:64px 20px; color:var(--ink-soft); }
  .empty .medallion-lg{ width:64px; height:64px; margin:0 auto 18px; border:2px solid var(--line); transform:rotate(45deg); display:grid; place-items:center; }
  .empty .medallion-lg span{ transform:rotate(-45deg); font-family:var(--display); font-size:26px; color:var(--saffron); }
  .empty h3{ font-family:var(--display); font-size:20px; color:var(--ink); margin:0 0 6px; }

  /* ---------- Form ---------- */
  form.wo-form{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:28px 30px; }
  .fieldset{ border:0; padding:0; margin:0 0 26px; }
  .fieldset legend{ font-family:var(--display); font-size:16px; color:var(--indigo); font-weight:600; padding:0; margin-bottom:14px; display:flex; align-items:center; gap:10px; width:100%; }
  .fieldset legend::after{ content:""; flex:1; height:1px; background:var(--line); }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 18px; }
  .grid.thirds{ grid-template-columns:1fr 1fr 1fr; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:13px; font-weight:600; color:var(--ink); }
  .field label .req{ color:var(--madder); }
  .field .hint{ font-size:11.5px; color:var(--ink-soft); font-weight:400; }
  input, select, textarea{
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:var(--white); border:1px solid var(--line); border-radius:var(--r);
    padding:10px 12px; width:100%; outline:none; transition:border-color .12s, box-shadow .12s;
  }
  textarea{ resize:vertical; min-height:74px; line-height:1.5; }
  input:focus, select:focus, textarea:focus{ border-color:var(--indigo); box-shadow:0 0 0 3px rgba(34,49,84,.12); }
  input.err, select.err{ border-color:var(--madder); box-shadow:0 0 0 3px rgba(126,43,52,.12); }
  .money-wrap{ position:relative; }
  .money-wrap::before{ content:"$"; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:14.5px; }
  .money-wrap input{ padding-left:24px; }
  .type-choose{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .type-choose label{
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    border:1px solid var(--line); border-radius:10px; padding:14px 8px; background:var(--white);
    font-weight:600; font-size:13.5px; text-align:center; transition:border-color .12s, background .12s;
  }
  .type-choose label .t-ico{ font-size:20px; }
  .type-choose input{ position:absolute; opacity:0; width:0; height:0; }
  .type-choose label:hover{ border-color:#c9bfa8; }
  .type-choose input:checked + span, .type-choose label.checked{ }
  .type-choose label.checked{ border-color:var(--indigo); background:var(--indigo-100); }
  .form-actions{ display:flex; gap:12px; justify-content:flex-end; align-items:center; border-top:1px solid var(--line); padding-top:20px; margin-top:4px; }
  .form-msg{ margin-right:auto; font-size:13px; color:var(--madder); }

  /* ---------- Detail ---------- */
  .detail-actions{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:20px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start; }
  .doc{ background:var(--white); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .doc-head{ background:var(--indigo); color:#fff; padding:20px 26px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .doc-head .n{ font-family:var(--mono); font-size:14px; color:var(--saffron); }
  .doc-head h3{ font-family:var(--display); font-size:22px; margin:2px 0 0; font-weight:600; }
  .doc-body{ padding:24px 26px; }
  .row-pair{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-bottom:22px; }
  .kv h4{ font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px; font-weight:700; }
  .kv .line{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dotted var(--line-soft); }
  .kv .line:last-child{ border-bottom:0; }
  .kv .line .l{ color:var(--ink-soft); font-size:13.5px; }
  .kv .line .v{ font-weight:600; text-align:right; }
  .kv .line .v.mono{ font-family:var(--mono); font-weight:600; }
  .doc-notes{ background:var(--parchment); border-radius:8px; padding:14px 16px; font-size:14px; white-space:pre-wrap; }
  .doc-notes.empty-note{ color:var(--ink-soft); font-style:italic; }

  .side-panel{ display:flex; flex-direction:column; gap:16px; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .panel h4{ font-family:var(--display); font-size:15px; margin:0 0 12px; color:var(--indigo); }
  .status-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .status-opt{ border:1px solid var(--line); background:var(--white); border-radius:20px; padding:6px 13px; font-size:12.5px; cursor:pointer; font-weight:600; color:var(--ink-soft); }
  .status-opt.active{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .money-summary .line{ display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
  .money-summary .line.total{ border-top:1px solid var(--line); margin-top:4px; padding-top:10px; font-weight:700; font-size:16px; }
  .money-summary .mono{ font-family:var(--mono); }

  /* ---------- Settings ---------- */
  .settings-block{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:26px 28px; margin-bottom:20px; }
  .settings-block h3{ font-family:var(--display); font-size:18px; margin:0 0 6px; color:var(--indigo); }
  .settings-block p.desc{ color:var(--ink-soft); font-size:13.5px; margin:0 0 18px; }
  .backup-actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .steps{ counter-reset:step; list-style:none; padding:0; margin:16px 0 0; }
  .steps li{ position:relative; padding:0 0 14px 40px; font-size:14px; color:var(--ink); }
  .steps li::before{ counter-increment:step; content:counter(step); position:absolute; left:0; top:-1px; width:26px; height:26px; border-radius:50%; background:var(--indigo-100); color:var(--indigo); font-weight:700; font-size:13px; display:grid; place-items:center; }
  .steps li strong{ color:var(--ink); }
  .callout{ background:#f6f0e2; border:1px solid #e8dcbf; border-radius:10px; padding:14px 16px; font-size:13.5px; color:#6b5a2f; margin-top:16px; }
  .callout strong{ color:#5a4a24; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--indigo); color:#fff; padding:12px 20px; border-radius:10px; font-size:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Print document (hidden on screen) ---------- */
  #print-root{ display:none; }

  @media print{
    @page{ margin:16mm; }
    #app{ display:none !important; }
    #print-root{ display:block !important; }
    body{ background:#fff; }
    .print-doc{ color:#000; font-family:var(--display); }
    .guard{ height:10px; background:
      repeating-linear-gradient(45deg,#7e2b34 0,#7e2b34 6px,#fff 6px,#fff 12px);
      border-top:2px solid #7e2b34; border-bottom:2px solid #7e2b34; }
    .print-letterhead{ text-align:center; padding:6px 0 8px; }
    .print-letterhead img{ max-width:200px; height:auto; margin:0 auto 4px; display:block; }
    .print-letterhead .contact{ font-family:var(--body); font-size:11px; color:#333; margin-top:2px; }
    .print-title{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #000; padding-bottom:6px; margin:20px 0 16px; }
    .print-title h2{ font-size:18px; margin:0; }
    .print-title .pnum{ font-family:var(--mono); font-size:14px; }
    .print-cols{ display:grid; grid-template-columns:1fr 1fr; gap:26px; font-family:var(--body); font-size:12.5px; }
    .print-cols h3{ font-family:var(--body); font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid #999; padding-bottom:4px; margin:0 0 8px; }
    .print-cols .pline{ display:flex; justify-content:space-between; padding:3px 0; }
    .print-cols .pline .pl{ color:#555; }
    .print-notes{ font-family:var(--body); font-size:12.5px; margin-top:18px; }
    .print-notes h3{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid #999; padding-bottom:4px; }
    .print-money{ font-family:var(--body); margin-top:18px; border:1px solid #000; }
    .print-money .pline{ display:flex; justify-content:space-between; padding:7px 14px; font-size:13px; border-bottom:1px solid #ccc; }
    .print-money .pline:last-child{ border-bottom:0; font-weight:700; font-size:15px; background:#f2f2f2; }
    .print-sign{ display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:44px; font-family:var(--body); font-size:11px; }
    .print-sign .sig{ border-top:1px solid #000; padding-top:5px; color:#444; }
    .print-foot{ text-align:center; font-family:var(--body); font-size:10px; color:#777; margin-top:30px; border-top:1px solid #ccc; padding-top:8px; }
  }

  @media (max-width:820px){
    #app{ grid-template-columns:1fr; }
    .sidebar{ position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; }
    .brand{ border:0; margin:0; padding:0 10px 0 0; }
    .brand .medallion{ display:none; }
    .nav-spacer, .side-note{ display:none; }
    .main{ padding:22px; }
    .detail-grid{ grid-template-columns:1fr; }
    .grid, .grid.thirds{ grid-template-columns:1fr; }
    .order-row, .list-head{ grid-template-columns:70px 1fr 90px; }
    .order-row .type-tag, .order-row .cost, .list-head .c-type, .list-head .c-cost{ display:none; }
  }
</style>
</head>

  /* ---------------- Storage ---------------- */
  var ORDERS_KEY = "FH_WORKORDERS_v1";
  var SETTINGS_KEY = "FH_SETTINGS_v1";
  var storageOK = true;

  function loadOrders(){
    try { return JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveOrders(){
    try { localStorage.setItem(ORDERS_KEY, JSON.stringify(state.orders)); }
    catch(e){ storageOK = false; toast("Couldn't save — see Backup notes"); }
    if(state.backup && state.backup.status === "connected"){
      writeBackupNow().catch(function(){});
    }
  }

  /* ---------------- Auto backup (File System Access API) ---------------- */
  var IDB_NAME = "FH_AppDB", IDB_STORE = "handles";
  function idbOpen(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbSet(key, val){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbDelete(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  async function initBackupHandle(){
    if(!state.backup.supported) return;
    try {
      var handle = await idbGet("backupDir");
      if(!handle) return;
      state.backup.handle = handle;
      state.backup.folderName = handle.name;
      var perm = await handle.queryPermission({mode:"readwrite"});
      state.backup.status = (perm === "granted") ? "connected" : "needs-permission";
    } catch(e){ state.backup.status = "error"; }
    if(state.view === "settings") renderSettings();
  }

  async function connectBackupFolder(){
    if(!state.backup.supported){
      toast("This browser can't do automatic backup — use the download button below");
      return;
    }
    try {
      var handle = await window.showDirectoryPicker({ mode:"readwrite" });
      var perm = await handle.requestPermission({mode:"readwrite"});
      if(perm !== "granted"){ toast("Permission not granted — backup not connected"); return; }
      await idbSet("backupDir", handle);
      state.backup.handle = handle;
      state.backup.folderName = handle.name;
      state.backup.status = "connected";
      toast("Connected — backing up to \u201c"+handle.name+"\u201d");
      await writeBackupNow();
      renderSettings();
    } catch(e){
      if(e && e.name === "AbortError") return;
      toast("Couldn't connect that folder");
    }
  }

  async function reconnectBackupPermission(){
    if(!state.backup.handle) return;
    try {
      var perm = await state.backup.handle.requestPermission({mode:"readwrite"});
      if(perm === "granted"){
        state.backup.status = "connected";
        toast("Automatic backup resumed");
        await writeBackupNow();
      } else { toast("Permission still not granted"); }
      renderSettings();
    } catch(e){ toast("Couldn't resume backup"); }
  }

  async function disconnectBackupFolder(){
    await idbDelete("backupDir");
    state.backup.handle = null; state.backup.status = "none"; state.backup.folderName = "";
    toast("Automatic backup disconnected");
    renderSettings();
  }

  function backupPayload(){
    return JSON.stringify({ app:"Fargo Hanna Work Orders", version:1, exportedAt:new Date().toISOString(),
      settings:state.settings, orders:state.orders }, null, 2);
  }
  async function writeFileToBackupDir(filename, contents){
    try {
      var fh = await state.backup.handle.getFileHandle(filename, {create:true});
      var w = await fh.createWritable();
      await w.write(contents);
      await w.close();
      return true;
    } catch(e){ state.backup.status = "error"; return false; }
  }
  async function writeBackupNow(){
    if(!state.backup.handle || state.backup.status !== "connected") return;
    var payload = backupPayload();
    var ok = await writeFileToBackupDir("fargo-hanna-latest-backup.json", payload);
    if(!ok){ if(state.view === "settings") renderSettings(); return; }
    state.backup.lastBackupAt = new Date().toISOString();
    var today = todayISO();
    if(state.settings.lastDailySnapshotDate !== today){
      var dailyOk = await writeFileToBackupDir("fargo-hanna-daily-"+today+".json", payload);
      if(dailyOk){ state.settings.lastDailySnapshotDate = today; saveSettings(); }
    }
    if(state.view === "settings") renderSettings();
  }
  function loadSettings(){
    var def = {
      shopName:"Fargo Hanna Oriental Rugs",
      address:"",
      phone:"",
      email:"",
      nextNumber:1001
    };
    try {
      var s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      return Object.assign(def, s || {});
    } catch(e){ return def; }
  }
  function saveSettings(){
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); } catch(e){}
  }

  var state = {
    view: "list",
    selectedId: null,
    editingId: null,
    search: "",
    filterStatus: "all",
    filterType: "all",
    orders: loadOrders(),
    settings: loadSettings(),
    backup: {
      supported: typeof window.showDirectoryPicker === "function",
      handle: null, status: "none", folderName: "", lastBackupAt: null
    }
  };

  /* ---------------- Helpers ---------------- */
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }
  function money(n){
    var v = Number(n)||0;
    return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtDate(iso){
    if(!iso) return "—";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    return d.toLocaleDateString("en-US",{month:"short", day:"numeric", year:"numeric"});
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function typeLabel(t){ return ({cleaning:"Cleaning",repair:"Repair",pad:"Pad",misc:"Misc"})[t] || "Misc"; }
  function typeIcon(t){ return ({cleaning:"🧼",repair:"🧵",pad:"▤",misc:"◆"})[t] || "◆"; }
  function statusMeta(s){
    return ({
      "New":{cls:"new"}, "In Progress":{cls:"progress"},
      "Ready for Pickup":{cls:"ready"}, "Picked Up":{cls:"picked"}
    })[s] || {cls:"new"};
  }
  var STATUSES = ["New","In Progress","Ready for Pickup","Picked Up"];

  function balance(o){ return (Number(o.cost)||0) - (Number(o.deposit)||0); }

  var toastTimer;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  /* ---------------- Router / render ---------------- */
  var main = document.getElementById("main");
  function render(){
    document.querySelectorAll(".nav-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.nav === (state.view==="detail"||state.view==="edit" ? "list" : state.view));
    });
    if(state.view==="list") renderList();
    else if(state.view==="new"||state.view==="edit") renderForm();
    else if(state.view==="detail") renderDetail();
    else if(state.view==="settings") renderSettings();
    window.scrollTo(0,0);
  }
  function go(view, id){ state.view=view; if(id!==undefined) state.selectedId=id; render(); }

  /* ---------------- List ---------------- */
  function filteredOrders(){
    var q = state.search.trim().toLowerCase();
    return state.orders.filter(function(o){
      if(state.filterStatus!=="all" && o.status!==state.filterStatus) return false;
      if(state.filterType!=="all" && o.type!==state.filterType) return false;
      if(!q) return true;
      return (o.number+" "+o.customer.name+" "+o.customer.phone+" "+o.customer.email+" "+(o.item.description||""))
        .toLowerCase().indexOf(q) !== -1;
    }).sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  }

  function renderList(){
    var list = filteredOrders();
    var open = state.orders.filter(function(o){ return o.status!=="Picked Up"; }).length;
    var html = ''
      + '<div class="page-head">'
      +   '<div><h2>Work orders</h2><div class="sub">'+state.orders.length+' total · '+open+' open</div></div>'
      +   '<button class="btn primary" data-nav="new">＋ New work order</button>'
      + '</div>'
      + '<div class="toolbar">'
      +   '<div class="search"><span>🔍</span><input id="search" placeholder="Search name, phone, number…" value="'+esc(state.search)+'"></div>'
      +   '<select class="filter" id="fStatus">'+statusOptions(state.filterStatus)+'</select>'
      +   '<select class="filter" id="fType">'+typeOptions(state.filterType)+'</select>'
      + '</div>';

    if(state.orders.length===0){
      html += emptyState("No work orders yet","Create your first one to start tracking cleaning, repairs, and pads.");
    } else if(list.length===0){
      html += emptyState("No matches","Try a different search or clear the filters.");
    } else {
      html += '<div class="list-head"><div>Order</div><div>Customer</div><div class="c-type">Type</div><div>Status</div><div class="r c-cost">Total</div></div>';
      list.forEach(function(o){
        var sm = statusMeta(o.status);
        html += ''
          + '<div class="order-row" data-open="'+o.id+'">'
          +   '<div class="num">'+esc(o.number)+'</div>'
          +   '<div class="who">'+esc(o.customer.name)+'<small>'+esc(o.customer.phone||o.customer.email||"")+'</small></div>'
          +   '<div class="type-tag"><span class="type-pill '+o.type+'">'+typeLabel(o.type)+'</span></div>'
          +   '<div><span class="badge '+sm.cls+'">'+esc(o.status)+'</span></div>'
          +   '<div class="cost">'+money(o.cost)+'</div>'
          + '</div>';
      });
    }
    main.innerHTML = html;

    document.getElementById("search").addEventListener("input", function(e){ state.search=e.target.value; refreshListOnly(); });
    document.getElementById("fStatus").addEventListener("change", function(e){ state.filterStatus=e.target.value; refreshListOnly(); });
    document.getElementById("fType").addEventListener("change", function(e){ state.filterType=e.target.value; refreshListOnly(); });
    main.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ go("detail", el.dataset.open); });
    });
    var nb = main.querySelector('[data-nav="new"]');
    if(nb) nb.addEventListener("click", function(){ go("new"); });
  }
  function refreshListOnly(){
    // re-render just the rows without losing input focus
    var focusEl = document.activeElement;
    var caret = focusEl && focusEl.id==="search" ? focusEl.selectionStart : null;
    renderList();
    if(caret!==null){ var s=document.getElementById("search"); s.focus(); s.setSelectionRange(caret,caret); }
  }
  function statusOptions(sel){
    var o = '<option value="all"'+(sel==="all"?" selected":"")+'>All statuses</option>';
    STATUSES.forEach(function(s){ o+='<option value="'+s+'"'+(sel===s?" selected":"")+'>'+s+'</option>'; });
    return o;
  }
  function typeOptions(sel){
    var types=[["all","All types"],["cleaning","Cleaning"],["repair","Repair"],["pad","Pad"],["misc","Misc"]];
    return types.map(function(t){ return '<option value="'+t[0]+'"'+(sel===t[0]?" selected":"")+'>'+t[1]+'</option>'; }).join("");
  }
  function emptyState(title, sub){
    return '<div class="empty"><div class="medallion-lg"><span>FH</span></div><h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p></div>';
  }

    main.innerHTML = ''

    +   '<button class="btn ghost" id="cancelForm">Cancel</button></div>'

    + '</fieldset>'

    + '<fieldset class="fieldset"><legend>Customer</legend>'

    // interactions
    main.querySelectorAll(".type-choose label").forEach(function(lab){
      lab.addEventListener("click", function(){
        main.querySelectorAll(".type-choose label").forEach(function(l){ l.classList.remove("checked"); });
        lab.classList.add("checked");
        lab.querySelector("input").checked = true;
      });
    });
    function recalcBalance(){
      var c = parseFloat(main.querySelector("#cost").value)||0;
      var d = parseFloat(main.querySelector("#deposit").value)||0;
      main.querySelector("#balanceView").value = (c-d).toFixed(2);
    }
    main.querySelector("#cost").addEventListener("input", recalcBalance);
    main.querySelector("#deposit").addEventListener("input", recalcBalance);

  function typeChoice(val, ico, label, current){
    var checked = current===val;
    return '<label class="'+(checked?"checked":"")+'"><span class="t-ico">'+ico+'</span>'
      + '<input type="radio" name="wtype" value="'+val+'"'+(checked?" checked":"")+'>'
      + '<span>'+label+'</span></label>';
  }
  function field(label, id, val, opts){
    opts=opts||{};
    return '<div class="field"><label for="'+id+'">'+esc(label)+(opts.req?' <span class="req">*</span>':'')
      + (opts.hint?' <span class="hint">'+esc(opts.hint)+'</span>':'')
      + '</label><input type="'+(opts.type||"text")+'" id="'+id+'" value="'+esc(val)+'"></div>';
  }
  function moneyField(label, id, val, opts){
    opts=opts||{};
    return '<div class="field"><label for="'+id+'">'+esc(label)+(opts.req?' <span class="req">*</span>':'')+'</label>'
      + '<div class="money-wrap"><input type="number" step="0.01" min="0" id="'+id+'" value="'+(val!==""&&val!=null?esc(val):"")+'" placeholder="0.00"></div></div>';
  }

  function submitForm(editing, base){
    var g = function(id){ var el=main.querySelector("#"+id); return el?el.value.trim():""; };
    var typeEl = main.querySelector('input[name="wtype"]:checked');
    var errs = [];
    function mark(id, bad){ var el=main.querySelector("#"+id); if(el) el.classList.toggle("err", !!bad); }

    var name=g("cust_name"), phone=g("cust_phone"), cost=g("cost");
    mark("cust_name", !name); if(!name) errs.push("name");
    mark("cust_phone", !phone); if(!phone) errs.push("phone");
    mark("cost", cost===""); if(cost==="") errs.push("cost");
    var typeOk = !!typeEl;

    if(errs.length || !typeOk){
      main.querySelector("#formMsg").textContent =
        (!typeOk?"Pick a type of work. ":"") + (errs.length?"Fill in the highlighted fields.":"");
      return;
    }

    var o = editing ? getOrder(state.selectedId) : base;
    o.type = typeEl.value;
    o.customer = { name:name, phone:phone, email:g("cust_email"), address:g("cust_address") };
    o.item = { description:g("item_desc"), dimensions:g("item_dim"), addons:g("item_addons") };
    o.dropoffDate = g("dropoff");
    o.readyDate = g("ready");
    o.cost = parseFloat(g("cost"))||0;
    o.deposit = parseFloat(g("deposit"))||0;
    o.notes = g("notes");

    if(!editing){
      o.id = "wo_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
      o.number = "FH-"+state.settings.nextNumber;
      o.createdAt = new Date().toISOString();
      o.status = "New";
      state.settings.nextNumber += 1;
      state.orders.push(o);
      saveSettings();
      saveOrders();
      toast("Work order "+o.number+" created");
      go("detail", o.id);
    } else {
      saveOrders();
      toast("Changes saved");
      go("detail", o.id);
    }
  }

      item:{description:"",dimensions:"",addons:""},
      dropoffDate:todayISO(), readyDate:"", cost:"", deposit:"", notes:"" };
  }

  function setStatus(o, s){

  function deleteOrder(o){
    if(!confirm("Delete work order "+o.number+" for "+o.customer.name+"?\nThis can’t be undone (but your last OneDrive backup still has it).")) return;
    state.orders = state.orders.filter(function(x){ return x.id!==o.id; });

  /* ---------------- Email (opens Outlook via mailto) ---------------- */
  function shopSignature(){
    var s = state.settings, lines = [s.shopName];
    if(s.address) lines.push(s.address);
    if(s.phone) lines.push(s.phone);
    if(s.email) lines.push(s.email);
    return lines.join("\n");
  }
  function emailWorkOrder(o){
    if(!o.customer.email){ toast("No email on file — add one via Edit"); return; }
    var s = state.settings;
    var body =
      "Dear "+o.customer.name+",\n\n"+
      "Thank you for trusting "+s.shopName+" with your rug. Here is your work order:\n\n"+
      "Work order:   "+o.number+"\n"+
      "Type of work: "+typeLabel(o.type)+"\n"+
      (o.item.description?"Details:      "+o.item.description+"\n":"")+
      (o.item.dimensions?"Rug size:     "+o.item.dimensions+"\n":"")+
      (o.item.addons?"Add-ons:      "+o.item.addons+"\n":"")+
      "Dropped off:  "+fmtDate(o.dropoffDate)+"\n"+
      "Expected ready: "+fmtDate(o.readyDate)+"\n\n"+
      "Estimated total: "+money(o.cost)+"\n"+
      "Deposit paid:    "+money(o.deposit)+"\n"+
      "Balance due:     "+money(balance(o))+"\n\n"+
      "We’ll be in touch when your rug is ready. Please keep this order number for your records.\n\n"+
      "Warm regards,\n"+shopSignature();
    var subject = s.shopName+" — Work Order "+o.number;
    openMail(o.customer.email, subject, body);
  }
  function markReady(o){
    if(!o.customer.email){ toast("Add an email first (Edit)"); return; }
    o.status = "Ready for Pickup"; saveOrders();
    var s = state.settings;
    var body =
      "Dear "+o.customer.name+",\n\n"+
      "Good news — your rug is ready for pickup!\n\n"+
      "Work order:  "+o.number+"\n"+
      "Type of work: "+typeLabel(o.type)+"\n"+
      "Balance due at pickup: "+money(balance(o))+"\n\n"+
      "Please stop by at your convenience. If you have any questions, just reply to this email or give us a call.\n\n"+
      "Thank you,\n"+shopSignature();
    openMail(o.customer.email, s.shopName+" — Your rug is ready ("+o.number+")", body);
    renderDetail();
    toast("Marked ready — email drafted in Outlook");
  }
  function openMail(to, subject, body){
    var url = "mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    // Fallback copy in case no mail client is configured
    try { window.location.href = url; } catch(e){}
    toast("Opening Outlook…");
  }

  /* ---------------- Settings & backup ---------------- */
  function renderBackupStatusBlock(){
    var b = state.backup;
    if(!b.supported){
      return '<div class="callout"><strong>Not available in this browser.</strong> Automatic backup needs Edge or Chrome. Use the manual buttons below instead.</div>';
    }
    if(b.status === "connected"){
      var when = b.lastBackupAt ? new Date(b.lastBackupAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "just now";
      return ''
        + '<div class="callout" style="background:#e9f1ea;border-color:#bfd9c4;color:#2f4a34">'
        +   '<strong>Connected</strong> — backing up automatically to \u201c'+esc(b.folderName)+'\u201d. Last backup: '+esc(when)+'.'
        + '</div>'
        + '<div class="backup-actions" style="margin-top:12px"><button class="btn ghost" id="disconnectBackup">Disconnect</button></div>';
    }
    if(b.status === "needs-permission"){
      return ''
        + '<div class="callout"><strong>Needs a quick reconnect.</strong> Your browser needs one click to resume writing to \u201c'+esc(b.folderName)+'\u201d.</div>'
        + '<div class="backup-actions" style="margin-top:12px"><button class="btn primary" id="resumeBackup">Resume automatic backup</button></div>';
    }
    if(b.status === "error"){
      return ''
        + '<div class="callout" style="background:#faf0f1;border-color:#e3c6c9;color:#642128"><strong>Couldn\u2019t write to that folder.</strong> It may have been moved or renamed.</div>'
        + '<div class="backup-actions" style="margin-top:12px"><button class="btn primary" id="connectBackup">Reconnect a folder</button></div>';
    }
    return '<div class="backup-actions"><button class="btn primary" id="connectBackup">Connect backup folder</button></div>';
  }

  function renderSettings(){
    var s = state.settings;
    main.innerHTML = ''
    + '<div class="page-head"><div><h2>Backup &amp; settings</h2>'
    +   '<div class="sub">Shop details for printed orders and emails · saving a copy to OneDrive</div></div></div>'

    + '<div class="settings-block">'
    +   '<h3>Shop details</h3>'
    +   '<p class="desc">These appear on the printed work order and in customer emails.</p>'
    +   '<div class="grid">'
    +     field("Shop name","set_name",s.shopName,{})
    +     field("Phone","set_phone",s.phone,{type:"tel"})
    +     field("Email","set_email",s.email,{type:"email"})
    +     '<div class="field"><label for="set_address">Address</label><input id="set_address" value="'+esc(s.address)+'"></div>'
    +   '</div>'
    +   '<div style="margin-top:16px"><button class="btn primary" id="saveShop">Save shop details</button></div>'
    + '</div>'

    + '<div class="settings-block">'
    +   '<h3>Back up to OneDrive</h3>'
    +   '<p class="desc">Connect your OneDrive folder once, and every time you create or edit a work order, a backup saves there automatically — no clicking required.</p>'
    +   renderBackupStatusBlock()
    +   '<div class="callout"><strong>Note:</strong> automatic backup needs this page opened over its https:// web link (like the GitHub Pages address), not by double-clicking the file directly.</div>'
    + '</div>'

    + '<div class="settings-block">'
    +   '<h3>Manual backup (always available)</h3>'
    +   '<p class="desc">Works in any browser, no setup needed. Use this as a backup to the backup.</p>'
    +   '<div class="backup-actions">'
    +     '<button class="btn madder" id="expJson">⬇ Download backup (.json)</button>'
    +     '<button class="btn" id="expCsv">⬇ Export list (.csv for Excel)</button>'
    +     '<button class="btn ghost" id="impJson">⬆ Restore from backup</button>'
    +     '<input type="file" id="impFile" accept=".json,application/json" style="display:none">'
    +   '</div>'
    + '</div>';

    main.querySelector("#saveShop").addEventListener("click", function(){
      state.settings.shopName = main.querySelector("#set_name").value.trim() || "Fargo Hanna Oriental Rugs";
      state.settings.phone = main.querySelector("#set_phone").value.trim();
      state.settings.email = main.querySelector("#set_email").value.trim();
      state.settings.address = main.querySelector("#set_address").value.trim();
      saveSettings(); toast("Shop details saved");
    });
    main.querySelector("#expJson").addEventListener("click", exportJSON);
    main.querySelector("#expCsv").addEventListener("click", exportCSV);
    var impFile = main.querySelector("#impFile");
    main.querySelector("#impJson").addEventListener("click", function(){ impFile.click(); });
    impFile.addEventListener("change", importJSON);
    var connectBtn = main.querySelector("#connectBackup");
    if(connectBtn) connectBtn.addEventListener("click", connectBackupFolder);
    var resumeBtn = main.querySelector("#resumeBackup");
    if(resumeBtn) resumeBtn.addEventListener("click", reconnectBackupPermission);
    var disconnectBtn = main.querySelector("#disconnectBackup");
    if(disconnectBtn) disconnectBtn.addEventListener("click", function(){
      if(confirm("Disconnect automatic backup? Your existing backup files stay in the folder, but new changes won\u2019t be saved there until you reconnect.")) disconnectBackupFolder();
    });
  }

  function download(filename, text, mime){
    var blob = new Blob([text], {type:mime||"application/octet-stream"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }
  function stamp(){
    var d=new Date();
    return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
  }
  function exportJSON(){
    var data = { app:"Fargo Hanna Work Orders", version:1, exportedAt:new Date().toISOString(),
                 settings:state.settings, orders:state.orders };
    download("fargo-hanna-backup-"+stamp()+".json", JSON.stringify(data,null,2), "application/json");
    toast("Backup downloaded — save it to OneDrive");
  }
  function exportCSV(){
    var head = ["Number","Status","Type","Customer","Phone","Email","Description","Dropped off","Expected ready","Total","Deposit","Balance"];
    var rows = state.orders.map(function(o){
      return [o.number,o.status,typeLabel(o.type),o.customer.name,o.customer.phone,o.customer.email,
        (o.item.description||"").replace(/\s+/g," "),o.dropoffDate,o.readyDate,
        (Number(o.cost)||0).toFixed(2),(Number(o.deposit)||0).toFixed(2),balance(o).toFixed(2)];
    });
    var csv = [head].concat(rows).map(function(r){
      return r.map(function(c){ var v=String(c==null?"":c); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",");
    }).join("\r\n");
    download("fargo-hanna-orders-"+stamp()+".csv", "\ufeff"+csv, "text/csv");
    toast("CSV exported");
  }
  function importJSON(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if(!data.orders || !Array.isArray(data.orders)) throw new Error("bad");
        if(!confirm("Restore "+data.orders.length+" work orders from this backup?\nThis replaces what’s currently on this computer.")) return;
        state.orders = data.orders;
        if(data.settings) state.settings = Object.assign(state.settings, data.settings);
        saveOrders(); saveSettings();
        toast("Restored "+data.orders.length+" work orders");
        go("list");
      } catch(err){ alert("That file couldn’t be read as a Fargo Hanna backup. Make sure it’s a .json backup exported from this app."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  /* ---------------- Nav wiring ---------------- */
  document.querySelectorAll(".nav-btn").forEach(function(b){
    b.addEventListener("click", function(){ go(b.dataset.nav); });
  });

  // storage sanity check
  try { localStorage.setItem("__fh_test","1"); localStorage.removeItem("__fh_test"); }
  catch(e){ storageOK=false; }

  render();
  initBackupHandle();
  if(!storageOK){
    toast("Heads up: saving is blocked here — open the file directly on your computer.");
  }
})();
</script>
</body>
</html>
